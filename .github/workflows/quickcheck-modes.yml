name: QuickCheck Modes

on:
  push:
  workflow_dispatch:
    inputs:
      mode:
        description: "functional, ui or both"
        default: both

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PORT: "8080"
      TEST_URL: http://localhost:8080/demo/     # change to your real site
      TEST_MODE: ${{ github.event.inputs.mode || 'both' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Start practice site
        run: |
          nohup python app.py > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/demo/ >/dev/null && break; sleep 1; done
      - run: pytest --html=reports/quickcheck-modes.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quickcheck-modes-report
          path: |
            reports/
            results/pytest/
