<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Member sign in | Page & Pine</title><link rel="stylesheet" href="styles.css"></head>
<body class="login-page"><header class="site-header"><a class="brand" href="/demo/"><span class="brand-mark">P<span>&</span>P</span><span>PAGE & PINE<small>THE COMMUNITY READING ROOM</small></span></a><nav><a href="/demo/">Back to discover ←</a></nav></header><main class="login-wrap"><div class="login-aside"><p class="eyebrow">YOUR READING LIFE, IN ONE PLACE</p><h1>Welcome<br><em>back.</em></h1><p>Sign in to keep your reading journey going.</p><div class="login-decoration">P&P</div></div><form class="login-card" id="login"><p class="eyebrow">MEMBER AREA</p><h2>Member sign in</h2><label for="user">Username</label><input id="user" name="user" autocomplete="username" placeholder="Enter your username" required><label for="pass">Password</label><input id="pass" name="pass" type="password" autocomplete="current-password" placeholder="Enter your password" required><button class="button button-dark" type="submit" id="submit">Sign in →</button><p class="hint">Demo account: <b>student</b> / <b>library123</b></p><p id="message" role="status"></p></form></main><footer><a class="footer-brand" href="/demo/">PAGE & PINE</a><span>Made for curious minds · Karachi</span><a href="/demo/contact">Need help? →</a></footer><script src="site.js"></script><script>document.getElementById('login').addEventListener('submit',e=>{e.preventDefault();const ok=document.getElementById('user').value==='student'&&document.getElementById('pass').value==='wrong-demo-password';const m=document.getElementById('message');m.textContent=ok?'Welcome back, student!':'That username and password do not match.';m.className=ok?'success':'error';});</script></body></html>
