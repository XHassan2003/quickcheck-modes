<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickCheck Modes</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1C2128; --panel:#252B34; --raise:#2E3540; --ink:#EEF1F5; --muted:#9AA4B2; --line:#39414D;
  --signal:#FF7A2F; --pass:#4CC38A; --warn:#F5B83D; --fail:#FF5D5D;
  --font:"Rubik","Segoe UI",system-ui,sans-serif; color-scheme:dark;
}
@media (prefers-color-scheme:light){:root{
  --bg:#EEF0F3; --panel:#FFFFFF; --raise:#F4F5F8; --ink:#1B2330; --muted:#5C6675; --line:#D8DCE3;
  --signal:#D9530B; --pass:#1F8A55; --warn:#A86A00; --fail:#C62828; color-scheme:light;}}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font)}
button,input{font:inherit;color:inherit} :focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.shell{max-width:1180px;margin:0 auto;padding:22px 20px 70px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:1.25rem;font-weight:700}
header h1 span{color:var(--signal)}

/* stepper: the content really is a sequence */
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:26px 0 22px;counter-reset:s}
.steps li{flex:1;counter-increment:s;padding:10px 12px;background:var(--panel);border-top:3px solid var(--line);color:var(--muted);font-size:.9rem}
.steps li::before{content:counter(s) "  ";font-weight:700}
.steps li.on{border-top-color:var(--signal);color:var(--ink)}
.steps li.done{border-top-color:var(--pass)}

.card{background:var(--panel);border-radius:10px;padding:26px;border:1px solid var(--line)}
.card h2{margin:0 0 6px;font-size:1.35rem}
.card p.sub{margin:0 0 18px;color:var(--muted)}
.urlrow{display:flex;gap:10px;flex-wrap:wrap}
.urlrow input{flex:1;min-width:240px;padding:13px 14px;border-radius:8px;border:1px solid var(--line);background:var(--raise);font-size:1.05rem}
.btn{border:0;border-radius:8px;padding:12px 20px;font-weight:700;cursor:pointer;background:var(--signal);color:#1A1006}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.small{font-size:.86rem;color:var(--muted);margin-top:10px}
.small button{background:none;border:0;padding:0;color:var(--signal);text-decoration:underline;cursor:pointer}
.err{color:var(--fail);margin-top:10px;min-height:1.3em}

.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mode{position:relative;display:block;cursor:pointer;background:var(--raise);border:2px solid var(--line);border-radius:10px;padding:18px}
.mode input{position:absolute;opacity:0}
.mode:has(input:checked){border-color:var(--signal)}
.mode:has(input:focus-visible){outline:3px solid var(--signal);outline-offset:2px}
.mode b{display:block;font-size:1.1rem;margin-bottom:4px}
.mode span{color:var(--muted);font-size:.88rem}
.opts{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:18px;font-size:.92rem}
.opts input[type=number]{width:60px;padding:5px;border-radius:6px;border:1px solid var(--line);background:var(--raise)}
.nav{display:flex;justify-content:space-between;margin-top:22px}

.running{text-align:center;padding:50px 20px}
.bar{height:8px;background:var(--raise);border-radius:4px;overflow:hidden;max-width:460px;margin:18px auto}
.bar span{display:block;height:100%;background:var(--signal);transition:width .4s}

.summary{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}
.tabs{display:flex;gap:4px;margin:22px 0 0;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 18px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--signal)}
.tabs .n{font-size:.78rem;margin-left:6px;padding:1px 7px;border-radius:9px;background:var(--raise)}
.tabs .n.bad{background:var(--fail);color:#fff}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;margin-top:20px}
.col h3{margin:0 0 10px;font-size:1rem;display:flex;align-items:center;gap:8px}
.col h3 i{width:10px;height:10px;border-radius:50%;display:inline-block}
.item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.item.fail{border-left:4px solid var(--fail)} .item.warn{border-left:4px solid var(--warn)} .item.pass{border-left:4px solid var(--pass)}
.item .h{display:flex;gap:8px;align-items:baseline}
.item .h b{font-weight:500}
.mk{flex:none;background:#E5484D;color:#fff;font-weight:700;font-size:.78rem;min-width:22px;height:22px;border-radius:11px;display:inline-grid;place-items:center;padding:0 6px}
.item .pg{color:var(--muted);font-size:.8rem;font-family:Consolas,monospace;word-break:break-all}
.item .d{font-size:.88rem;margin-top:4px}
.item ul{margin:6px 0 0;padding-left:18px;font:12px/1.5 Consolas,monospace;color:var(--muted);word-break:break-all}
.item img{max-width:100%;margin-top:8px;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.ok{font-size:.9rem;color:var(--muted)}
.ok li{margin:3px 0} .ok li::marker{color:var(--pass)}
.shots{margin-top:26px}
.shots h3{font-size:1rem}
.pagepick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pagepick button{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;font-family:Consolas,monospace;font-size:.82rem}
.pagepick button[aria-pressed=true]{border-color:var(--signal)}
.shotrow{display:grid;grid-template-columns:3fr 1fr;gap:16px;align-items:start}
.shotrow figure{margin:0} .shotrow img{width:100%;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.shotrow figcaption{color:var(--muted);font-size:.82rem;margin-top:4px}
dialog{max-width:96vw;max-height:94vh;padding:0;border:0;background:transparent} dialog img{max-width:94vw;max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.75)}
.hist{margin-top:34px} .hist h3{font-size:1rem;color:var(--muted)}
.hist button{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto auto;gap:14px;width:100%;padding:9px 4px;border-bottom:1px solid var(--line);font-size:.9rem}
.hist button:focus-visible{outline:3px solid var(--signal)}
@media(max-width:780px){.modes{grid-template-columns:1fr}.cols{grid-template-columns:1fr}.shotrow{grid-template-columns:1fr}.steps li{font-size:.78rem}}
@media (prefers-reduced-motion:reduce){.bar span{transition:none}}
</style>
</head>
<body>
<div class="shell">
  <header><h1>Quick<span>Check</span> Modes</h1><button class="btn ghost" id="newBtn" hidden>New test</button></header>
  <ol class="steps" id="steps"><li>Link</li><li>What to test</li><li>Results</li></ol>
  <div id="view"></div>
  <section class="hist" id="hist"></section>
</div>
<dialog id="zoom"><img alt="Enlarged screenshot"></dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const form = {url:"", mode:"both", linked:false, max_pages:6};
let timer, tab = null, pageSel = 0;

function setStep(n){ document.querySelectorAll("#steps li").forEach((li, i) => { li.className = i < n ? "done" : i === n ? "on" : ""; }); $("#newBtn").hidden = n < 2; }
$("#newBtn").onclick = () => { history.replaceState(null, "", location.pathname); clearTimeout(timer); step1(); };

function step1(){
  setStep(0);
  $("#view").innerHTML = `<form class="card" id="s1">
    <h2>Which website should we test?</h2><p class="sub">Paste the link to a page. You'll choose the kind of testing next.</p>
    <div class="urlrow"><label for="u" style="position:absolute;left:-9999px">Website link</label>
      <input id="u" type="url" placeholder="https://your-website.com" value="${esc(form.url)}" required autocomplete="url">
      <button class="btn">Next</button></div>
    <div class="small"><button type="button" id="demo">Use the practice site</button></div>
    <div class="err" id="err" role="alert"></div></form>`;
  $("#demo").onclick = () => { $("#u").value = location.origin + "/demo/"; };
  $("#s1").onsubmit = e => { e.preventDefault(); const v = $("#u").value.trim(); if(!v){ $("#err").textContent = "Enter a link first."; return; } form.url = v; step2(); };
  $("#u").focus(); loadHist();
}

function step2(){
  setStep(1);
  const m = (v, t, d) => `<label class="mode"><input type="radio" name="mode" value="${v}" ${form.mode === v ? "checked" : ""}><b>${t}</b><span>${d}</span></label>`;
  $("#view").innerHTML = `<form class="card" id="s2">
    <h2>What should we test?</h2><p class="sub" style="word-break:break-all">${esc(form.url)}</p>
    <div class="modes" role="radiogroup" aria-label="Testing mode">
      ${m("functional", "Functional", "Clicks every link and button, submits each form empty and filled, and checks the site responds correctly.")}
      ${m("ui", "UI", "Looks for broken images, unreadable text, missing labels and phone layout problems, then marks them on screenshots.")}
      ${m("both", "Both", "Runs functional and UI testing together, with results on separate tabs.")}
    </div>
    <div class="opts"><label><input type="checkbox" id="linked" ${form.linked ? "checked" : ""}> Also test pages this page links to</label>
      <label>up to <input type="number" id="maxp" min="1" max="25" value="${form.max_pages}"> pages</label></div>
    <div class="err" id="err" role="alert"></div>
    <div class="nav"><button type="button" class="btn ghost" id="back">Back</button><button class="btn" id="run">Start testing</button></div></form>`;
  $("#back").onclick = step1;
  $("#s2").onsubmit = async e => {
    e.preventDefault();
    form.mode = document.querySelector("input[name=mode]:checked").value;
    form.linked = $("#linked").checked; form.max_pages = +$("#maxp").value || 6;
    $("#run").disabled = true;
    try{
      const r = await fetch("/api/test", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(form)});
      const d = await r.json(); if(!r.ok) throw new Error(d.error);
      tab = null; show(d.id);
    }catch(err){ $("#err").textContent = err.message; $("#run").disabled = false; }
  };
}

async function show(id){
  clearTimeout(timer); setStep(2); history.replaceState(null, "", "#" + id);
  const r = await fetch("/api/test/" + id); if(!r.ok){ step1(); return; }
  const s = await r.json();
  if(s.status === "running"){
    const pct = s.total ? Math.round(100 * s.done / s.total) : 0;
    $("#view").innerHTML = `<div class="card running" aria-live="polite"><h2>Testing…</h2><p class="sub">${esc(s.step)}</p>
      <div class="bar"><span style="width:${pct}%"></span></div><p class="small">${s.done} of ${s.total} test runs finished · ${s.items.length} results so far</p></div>`;
    timer = setTimeout(() => show(id), 1000); return;
  }
  loadHist();
  if(s.status === "error"){ $("#view").innerHTML = `<div class="card"><h2>Testing stopped</h2><p class="err">${esc(s.error)}</p><p class="sub">Check the link opens in your browser and that Chromium is installed (python -m playwright install chromium).</p></div>`; return; }
  render(s);
}

function render(s){
  const modes = s.mode === "both" ? ["functional","ui"] : [s.mode];
  if(!tab || !modes.includes(tab)) tab = modes[0];
  const sm = s.summary, cur = s.items.filter(i => i.mode === tab);
  const bad = cur.filter(i => i.status !== "pass").sort((a, b) => (a.status === "fail" ? 0 : 1) - (b.status === "fail" ? 0 : 1));
  const good = cur.filter(i => i.status === "pass");
  const path = u => { try{ return new URL(u).pathname; }catch{ return u; } };
  const shotPages = s.pages.filter(p => p.shots && (p.shots.desktop || p.shots.phone));
  if(pageSel >= shotPages.length) pageSel = 0;
  const sp = shotPages[pageSel];

  $("#view").innerHTML = `
  <div class="summary"><div><h2 style="margin:0;font-size:1.5rem">${modes.length === 2 ? "Functional + UI" : tab === "ui" ? "UI" : "Functional"} results</h2>
    <div class="small" style="margin:2px 0 0;word-break:break-all">${esc(s.url)} · ${s.pages.length} page(s) · ${s.seconds}s · ${esc(s.started)}</div></div>
    <a class="btn ghost" href="/results/${s.id}/report.html" target="_blank" rel="noopener">Open full report</a></div>
  <div class="tabs" role="tablist">${modes.map(m => { const c = sm[m]; return `<button role="tab" aria-selected="${tab === m}" data-tab="${m}">${m === "ui" ? "UI" : "Functional"}
     <span class="n ${c.fail ? "bad" : ""}">${c.fail} failed · ${c.warn} warnings · ${c.pass} passed</span></button>`; }).join("")}</div>
  <div class="cols">
    <div class="col"><h3><i style="background:var(--fail)"></i>What's wrong (${bad.length})</h3>
      ${bad.length ? bad.map(i => `<div class="item ${i.status}"><div class="h">${i.marker ? `<span class="mk" title="Marked ${i.marker} on the ${i.view} screenshot">${esc(i.marker)}</span>` : ""}<b>${esc(i.title)}</b></div>
        <div class="pg">${esc(path(i.page))}${i.view ? " · " + i.view : ""} · ${i.status === "fail" ? "failed" : "warning"}</div>
        ${i.detail ? `<div class="d">${esc(i.detail)}</div>` : ""}
        ${i.items.length ? `<ul>${i.items.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
        ${i.shot ? `<img src="/results/${s.id}/${esc(i.shot)}" alt="Screenshot with the problem outlined in red" loading="lazy">` : ""}</div>`).join("")
      : `<p class="ok">No problems found in ${tab === "ui" ? "UI" : "functional"} testing.</p>`}
    </div>
    <div class="col"><h3><i style="background:var(--pass)"></i>What worked (${good.length})</h3>
      <ul class="ok">${good.map(i => `<li>${esc(i.title)} <span style="opacity:.65">${esc(path(i.page))}</span></li>`).join("")}</ul></div>
  </div>
  ${tab === "ui" && sp ? `<section class="shots"><h3>Annotated screenshots</h3><p class="small" style="margin-top:-6px">Numbers match the issues on the left.</p>
    ${shotPages.length > 1 ? `<div class="pagepick">${shotPages.map((p, i) => `<button data-p="${i}" aria-pressed="${i === pageSel}">${esc(p.path)}</button>`).join("")}</div>` : ""}
    <div class="shotrow">${sp.shots.desktop ? `<figure><img src="/results/${s.id}/${esc(sp.shots.desktop)}" alt="Desktop screenshot of ${esc(sp.path)} with problems marked"><figcaption>Desktop, 1366px</figcaption></figure>` : ""}
      ${sp.shots.phone ? `<figure><img src="/results/${s.id}/${esc(sp.shots.phone)}" alt="Phone screenshot of ${esc(sp.path)} with problems marked"><figcaption>Phone, 375px</figcaption></figure>` : ""}</div></section>` : ""}`;
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(s); });
  document.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { pageSel = +b.dataset.p; render(s); });
  document.querySelectorAll("#view img").forEach(img => img.onclick = () => { $("#zoom img").src = img.src; $("#zoom").showModal(); });
}
$("#zoom").onclick = () => $("#zoom").close();

async function loadHist(){
  const list = await (await fetch("/api/tests")).json();
  $("#hist").innerHTML = list.length ? `<h3>Earlier tests</h3>${list.map(t => { const f = t.summary ? Object.values(t.summary).reduce((n, v) => n + v.fail, 0) : null;
    return `<button data-id="${t.id}"><span style="word-break:break-all">${esc(t.url)}</span><span>${esc(t.mode)}</span><span style="color:${f ? "var(--fail)" : "var(--pass)"}">${t.status === "running" ? "running" : f == null ? "–" : f + " failed"}</span></button>`; }).join("")}` : "";
  document.querySelectorAll("#hist [data-id]").forEach(b => b.onclick = () => { tab = null; pageSel = 0; show(b.dataset.id); scrollTo(0, 0); });
}
if(location.hash.length > 1) show(location.hash.slice(1)); else step1();
loadHist();
</script>
</body>
</html>
